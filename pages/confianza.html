<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confianza y verificación · Link Estudiantil</title>
  <meta name="description" content="Verificación de cuentas, reseñas y reportes.">
  <link rel="icon" href="../assets/logo.png">

  <!-- Tailwind CSS (CDN) + configuración con los tokens del UI Kit -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>

  <!-- Tipografía Inter (UI Kit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="confianza" data-auth="true">

  <div id="site-header"></div>

  <main class="app-container">
    <div class="page-head">
      <h1 class="page-title">Confianza y Verificación</h1>
      <p>Así cuidamos que las dos partes sepan con quién están tratando.</p>
    </div>

    <a class="btn btn-primary" href="tutores.html" style="margin-bottom:1.5rem">Búsqueda por materia</a>

    <div class="confianza-grid">
      <section class="panel" style="margin:0">
        <h2 class="panel-title" style="margin-bottom:1rem">Resultados verificados</h2>
        <div class="card-grid card-grid--sm" id="resultados-confianza"></div>
      </section>

      <section class="panel" style="margin:0">
        <div class="panel-header">
          <h2 class="panel-title">Mis reseñas</h2>
          <button class="btn btn-primary btn-sm" id="btn-agregar-resena" type="button">Agregar reseña</button>
        </div>
        <div id="mis-resenas"></div>
      </section>

      <section class="panel" style="margin:0">
        <h2 class="panel-title" style="margin-bottom:1rem">Verificación</h2>
        <div class="verification-status">
          <div class="verification-icon" id="trust-icon" style="font-size:1.5rem;font-weight:800">!</div>
          <div style="flex:1">
            <strong id="trust-txt">Sin verificar</strong>
            <div class="trust-meter" id="trust"><span></span><span></span><span></span></div>
          </div>
        </div>
        <div class="stack" style="margin-top:1rem">
          <button class="btn btn-primary" id="btn-verificar" type="button">Verificar mi cuenta</button>
          <button class="btn btn-outline" id="btn-reportar" type="button">Reportar un usuario</button>
          <button class="btn btn-danger" id="btn-eliminar" type="button">Eliminar mi cuenta</button>
        </div>
      </section>

      <section class="panel" style="margin:0;text-align:center">
        <h2 class="panel-title">Cuenta Pro</h2>
        <div class="profile-photo-placeholder" id="pro-avatar" style="margin:1rem auto;width:96px;height:96px">LE</div>
        <p class="profile-name" id="pro-nombre">Usuario</p>
        <p class="hint" id="pro-rol"></p>
        <p class="star-rating">★★★★★</p>
        <div class="stack" style="margin-top:1rem">
          <a class="btn btn-primary" href="publicar.html">Crear clase</a>
          <a class="btn btn-outline" href="perfil.html">Ver opciones</a>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="site-tabbar"></div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
