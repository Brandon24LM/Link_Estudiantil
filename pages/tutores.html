<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar tutores · Link Estudiantil</title>
  <meta name="description" content="Filtra tutores por materia, modalidad y precio.">
  <link rel="icon" href="../assets/logo.png">

  <!-- Tailwind CSS (CDN) + configuración con los tokens del UI Kit -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>

  <!-- Tipografía Inter (UI Kit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="tutores">

  <div id="site-header"></div>

  <main class="app-container">
    <div class="page-head">
      <h1 class="page-title">Buscar Tutores</h1>
      <p>Filtra hasta encontrar al que encaja con tu horario y tu presupuesto.</p>
    </div>

    <section class="panel">
      <p class="filters-label">Búsqueda por</p>
      <div class="filters-form">
        <div class="search-input-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="f-texto" placeholder="Nombre, materia o tema…" aria-label="Buscar tutor">
        </div>
        <select class="filter-select" id="f-materia" aria-label="Materia"></select>
        <select class="filter-select" id="f-modalidad" aria-label="Modalidad">
          <option value="">Cualquier modalidad</option>
          <option>Virtual</option><option>Presencial</option><option>Híbrido</option>
        </select>
        <select class="filter-select" id="f-orden" aria-label="Ordenar por">
          <option value="rating">Mejor calificados</option>
          <option value="precio">Precio más bajo</option>
          <option value="resenas">Más reseñas</option>
        </select>
      </div>
      <div class="spread" style="margin-top:1rem">
        <label class="row" style="gap:.5rem;cursor:pointer">
          <input type="checkbox" id="f-verificado" style="accent-color:var(--color-primary)">
          <span>Solo tutores verificados</span>
        </label>
        <button class="btn btn-outline btn-sm" id="limpiar" type="button">Limpiar filtros</button>
      </div>
    </section>

    <div class="spread" style="margin:1.5rem 0 .75rem">
      <h2>Resultados</h2>
      <span class="results-count" id="contador"></span>
    </div>
    <div class="card-grid card-grid--lg" id="resultados"></div>

    <section class="panel" style="margin-top:2rem">
      <div class="panel-header">
        <h2 class="panel-title">Tutores disponibles ¡AHORA!</h2>
        <span class="chip chip--green">En línea</span>
      </div>
      <div class="card-grid card-grid--sm" id="ahora"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div id="site-tabbar"></div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
