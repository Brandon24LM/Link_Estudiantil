<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayuda · Link Estudiantil</title>
  <meta name="description" content="Preguntas frecuentes y contacto.">
  <link rel="icon" href="../assets/logo.png">

  <!-- Tailwind CSS (CDN) + configuración con los tokens del UI Kit -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>

  <!-- Tipografía Inter (UI Kit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="ayuda">

  <div id="site-header"></div>

  <main class="app-container">
    <div class="page-head">
      <h1 class="page-title">Centro de ayuda</h1>
      <p>Lo que más nos preguntan, y cómo escribirnos si falta algo.</p>
    </div>

    <div class="home-columns" style="grid-template-columns:1fr 360px">
      <section id="faq"></section>

      <aside id="contacto">
        <form class="panel" id="form-contacto" style="margin:0">
          <h2 class="panel-title" style="margin-bottom:1rem">Escríbenos</h2>
          <div class="form-group"><label for="a-nombre">Nombre</label><input id="a-nombre" required></div>
          <div class="form-group"><label for="a-correo">Correo</label><input type="email" id="a-correo" required></div>
          <div class="form-group"><label for="a-tema">Tema</label>
            <select id="a-tema"><option>Problema con una sesión</option><option>Pago o factura</option><option>Verificación de cuenta</option><option>Otro</option></select></div>
          <div class="form-group"><label for="a-msg">Mensaje</label><textarea id="a-msg" rows="4" required></textarea></div>
          <button class="btn btn-primary w-full" type="submit">Enviar mensaje</button>
        </form>

        <section class="panel">
          <h3 class="panel-title">Otros canales</h3>
          <ul class="stack" style="margin-top:.75rem">
            <li>Correo: hola@linkestudiantil.ec</li>
            <li>WhatsApp: +593 99 000 0000</li>
            <li>Horario: lunes a viernes, 08:00 a 18:00</li>
          </ul>
        </section>
      </aside>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="site-tabbar"></div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
