<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos · Link Estudiantil</title>
  <meta name="description" content="Catálogo de cursos para seguir a tu ritmo.">
  <link rel="icon" href="../assets/logo.png">

  <!-- Tailwind CSS (CDN) + configuración con los tokens del UI Kit -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>

  <!-- Tipografía Inter (UI Kit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="cursos">

  <div id="site-header"></div>

  <main class="app-container">
    <div class="page-head">
      <h1 class="page-title">Cursos</h1>
      <p>Contenido grabado por tutores verificados. Avanzas cuando puedes.</p>
    </div>

    <section class="panel">
      <div class="filters-form">
        <div class="search-input-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="c-texto" placeholder="Buscar curso o tutor…" aria-label="Buscar curso">
        </div>
        <select class="filter-select" id="c-materia" aria-label="Materia"></select>
        <select class="filter-select" id="c-orden" aria-label="Ordenar">
          <option value="rating">Mejor calificados</option>
          <option value="precio">Precio más bajo</option>
        </select>
      </div>
    </section>

    <div class="spread" style="margin:1.5rem 0 .75rem">
      <h2>Catálogo</h2><span class="results-count" id="c-contador"></span>
    </div>
    <div class="card-grid card-grid--lg" id="cursos-grid"></div>
  </main>

  <div id="site-footer"></div>
  <div id="site-tabbar"></div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
