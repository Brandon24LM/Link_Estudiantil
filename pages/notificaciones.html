<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificaciones · Link Estudiantil</title>
  <meta name="description" content="Mensajes, agenda y tareas pendientes.">
  <link rel="icon" href="../assets/logo.png">

  <!-- Tailwind CSS (CDN) + configuración con los tokens del UI Kit -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>

  <!-- Tipografía Inter (UI Kit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="notificaciones" data-auth="true">

  <div id="site-header"></div>

  <main id="contenido" tabindex="-1" class="app-container">
    <div class="page-head spread">
      <div>
        <h1 class="page-title">Notificaciones</h1>
        <p id="sin-leer" aria-live="polite">0 sin leer</p>
      </div>
    </div>

    <div class="notifications-layout">
      <!-- Columna 1: lista -->
      <section class="panel" style="margin:0">
        <h2 class="panel-title" style="margin-bottom:.75rem">Mensajes</h2>
        <ul class="messages-list" id="lista-mensajes"></ul>
      </section>

      <!-- Columna 2: detalle -->
      <section class="panel" style="margin:0" id="detalle"></section>

      <!-- Columna 3: agenda y tareas -->
      <div class="sidebar-col sidebar-col--right">
        <section class="panel" style="margin:0">
          <h2 class="panel-title" style="margin-bottom:.75rem">Agenda</h2>
          <div id="calendario"></div>
          <div class="agenda-actions">
            <button class="btn btn-primary btn-sm" id="btn-crear-evento" type="button">Crear evento</button>
            <button class="btn btn-danger btn-sm" id="btn-borrar-evento" type="button">Borrar evento</button>
          </div>
        </section>

        <section class="panel">
          <h2 class="panel-title" style="margin-bottom:.75rem">Tareas pendientes</h2>
          <form id="form-tarea" class="row" style="gap:.5rem;margin-bottom:.75rem">
            <input id="nueva-tarea" placeholder="Nueva tarea…" style="flex:1;padding:.55rem;border:1px solid var(--color-border);border-radius:var(--radius-sm)">
            <button class="btn btn-primary btn-sm" type="submit">Agregar</button>
          </form>
          <ul id="tareas"></ul>
        </section>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="site-tabbar"></div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
